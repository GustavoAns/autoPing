<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoPing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- ═══════════════ TELA PRINCIPAL ═══════════════ -->
    <section id="view-main" class="view" hidden>
      <header class="bar" data-tauri-drag-region>
        <div class="status" id="status" data-tauri-drag-region>
          <span class="dot"></span><span class="label" id="status-label">—</span>
        </div>
        <div class="actions">
          <button class="icon" id="btn-settings" title="Configurações" aria-label="Configurações">
            <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
          </button>
          <button class="icon" data-hide title="Ocultar" aria-label="Ocultar">
            <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
          </button>
        </div>
      </header>

      <div class="body" id="main-body">
        <div class="row">
          <span class="key">Canal</span>
          <span class="val" id="m-channel">—</span>
        </div>
        <!-- linhas específicas do modo ativo (MODES[mode].summary) -->
        <div id="m-mode-rows"></div>
        <div class="chips" id="m-chips"></div>
      </div>

      <footer class="foot">
        <span class="hint" id="m-hint">—</span>
        <button class="btn" id="btn-toggle">—</button>
      </footer>
    </section>

    <!-- ═══════════════ CONFIGURAÇÕES ═══════════════ -->
    <section id="view-config" class="view" hidden>
      <header class="bar" data-tauri-drag-region>
        <div class="title" data-tauri-drag-region>
          <button class="icon" id="btn-back" title="Voltar" aria-label="Voltar">
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <span data-tauri-drag-region>Configurações</span>
        </div>
        <div class="actions">
          <button class="icon" data-hide title="Ocultar" aria-label="Ocultar">
            <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
          </button>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="general">Geral</button>
        <button type="button" class="tab" data-tab="mode">Modo</button>
        <button type="button" class="tab" data-tab="alerts">Alertas</button>
      </nav>

      <form class="body form" id="form" autocomplete="off">
        <!-- ── Geral ── -->
        <div class="pane" data-pane="general">
          <label class="field">
            <span class="key">Token</span>
            <input type="password" id="f-token" spellcheck="false" autocomplete="off" />
            <small id="f-token-hint">Salvo no Cofre do Windows.</small>
          </label>

          <label class="field">
            <span class="key">Canal observado <button type="button" class="link" id="btn-refresh">atualizar lista</button></span>
            <select id="f-channel-select"></select>
            <input type="text" id="f-channel" inputmode="numeric" placeholder="ID do canal" spellcheck="false" />
          </label>

          <div class="opt" data-opt="sleep">
            <div class="opt-head">
              <button type="button" class="opt-title"><span class="chev"></span><span class="key">Sleep após responder</span><small class="opt-sum"></small></button>
              <input type="checkbox" class="switch" id="f-sleep" />
            </div>
            <div class="opt-body">
              <small>Depois de responder, desliga sozinho (🔵) até você clicar em Acordar.</small>
            </div>
          </div>
        </div>

        <!-- ── Modo ── -->
        <div class="pane" data-pane="mode" hidden>
          <label class="field">
            <span class="key">Modo de ping</span>
            <select id="f-mode"></select>
            <small id="f-mode-desc"></small>
          </label>
          <!-- campos do modo selecionado (MODES[mode].fields) -->
          <div id="f-mode-fields" class="pane-fields"></div>
        </div>

        <!-- ── Alertas ── -->
        <div class="pane" data-pane="alerts" hidden>
          <div class="opt" data-opt="sound">
            <div class="opt-head">
              <button type="button" class="opt-title"><span class="chev"></span><span class="key">Som ao responder</span><small class="opt-sum"></small></button>
              <input type="checkbox" class="switch" id="f-sound" />
            </div>
            <div class="opt-body">
              <small>Aviso curto quando a mensagem sai. <button type="button" class="link" data-test="ding">testar</button></small>
            </div>
          </div>

          <div class="opt" data-opt="alarm">
            <div class="opt-head">
              <button type="button" class="opt-title"><span class="chev"></span><span class="key">Alarme ao responder</span><small class="opt-sum"></small></button>
              <input type="checkbox" class="switch alarm" id="f-alarm" />
            </div>
            <div class="opt-body">
              <small>Toca sem parar até você desligar (substitui o som). <button type="button" class="link" data-test="alarm">testar</button></small>
            </div>
          </div>

          <div class="opt" data-opt="keywords">
            <div class="opt-head">
              <button type="button" class="opt-title"><span class="chev"></span><span class="key">Alerta de palavras</span><small class="opt-sum"></small></button>
              <input type="checkbox" class="switch" id="f-kw-enabled" />
            </div>
            <div class="opt-body">
              <small>Toca quando uma mensagem do canal observado contém uma das palavras. Funciona mesmo com o bot desligado.</small>
              <label class="field">
                <span class="key">Palavras <small class="counter" id="f-kw-count">0</small></span>
                <textarea id="f-kw-list" rows="3" placeholder="uma por linha&#10;ex.: ping&#10;vaga aberta" spellcheck="false"></textarea>
                <small>Maiúsculas, acentos e espaços extras são ignorados.</small>
              </label>
              <div class="switch-row">
                <span class="key">Tocar</span>
                <div class="segmented" role="radiogroup">
                  <label><input type="radio" name="f-kw-sound" value="ding" /><span>Som</span></label>
                  <label><input type="radio" name="f-kw-sound" value="alarm" /><span>Alarme</span></label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <p class="error" id="f-error" hidden></p>
      </form>

      <footer class="foot">
        <button class="btn ghost" id="btn-cancel" type="button">Cancelar</button>
        <button class="btn primary" id="btn-save" type="submit" form="form">Salvar</button>
      </footer>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
