[package]
name = "autoping"
version = "3.0.0"
description = "AutoPing - responde automaticamente a novos tópicos do Discord"
authors = ["GustavoAns"]
license = "MIT"
repository = "https://github.com/GustavoAns/autoPing"
edition = "2021"

[lib]
name = "autoping_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
